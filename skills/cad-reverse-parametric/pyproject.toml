[project]
name = "cadre"
version = "0.1.0"
description = "CAD Reverse-Engineering: generic STEP/STL probing, equivalence and parametric reconstruction"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "trimesh",
    "scipy",
    "rtree",
    "ezdxf",
    "pyyaml",
    "cadquery>=2.4.0",
    "duckdb>=1.5.3",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadre"]
