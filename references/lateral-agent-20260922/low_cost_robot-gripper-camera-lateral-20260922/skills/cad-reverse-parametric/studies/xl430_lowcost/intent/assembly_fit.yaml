design_hypotheses:
  evaluated_in: temp/assembly_resolution/datum_strategy_comparison.json
  variants: [preserve_output_link, preserve_case_face, symmetric_case_width]
  chosen_variant: null
  motor_cluster_diagnostic:
    report: temp/assembly_resolution/motor_cluster_strategy.json
    strategy: preserve_case_face_and_propagate_then_half_width_gripper_offset
    gripper_group_offset_along_wrist_output_mm: 4.25
    motor_solids: 144
    inter_motor_pairs: 8640
    bbox_overlapping_pairs: 0
    nearest_motor_distance_mm: 1.15
    scope: Static motor-to-motor only; links have NOT been reshaped or accepted.
  gripper_width_only_probe:
    status: blocked_by_source_boolean_identity_preflight_no_candidate_exported
    occurrence: KEEP_117_static_side_1
    frame: J5_GRIPPER_XL430_00_DC11_A01_DUMMY_1
    cut_axis: X
    cut_coordinate_mm: -4.5
    moving_region: X less than -4.5 in the unchanged source motor frame
    moving_translation_mm: [-4.25, 0, 0]
    bridge: Extrusion of the exact source section, not a bounding rectangle.
    preserve_fixed_region: Source material for X greater than -4.5, including the entire finger.
    preserve_moving_region: Original left chunk rigidly translated; bore and countersink profiles unchanged.
    uniform_section_guard_half_width_mm: 0.25
    numerical_symmetric_difference_tolerance_mm3: 0.0000001
    numerical_tolerance_is_manufacturing_clearance: false
    source_section_area_mm2: 153.344309524
    expected_side_wall_mm: {thickness: 3.0, inner_x: -14.400000316, outer_x: -17.400000316}
    functional_warning: Left case holes move with this chunk; this probe does not yet locate them on the new case pattern.
    rejected_cuts:
      - {axis: X, coordinate_mm: -10.05, reason: Cuts countersinks and would elongate them.}
      - {axis: Y, coordinate_mm: -24.55, reason: Cuts the finger and countersinks.}
      - {axis: Z, coordinate_mm: -19.4, reason: Cuts the curved finger root.}
    required_tests:
      - Zero extension preserves the original solid.
      - All three axes and both directions preserve stationary and translated chunks.
      - A bore cut across its diameter fails the uniform-section guard.
      - Non-solid, empty section, out-of-range cut, non-finite dimensions and kernel errors cannot pass.
      - Real source cut at X=-10.05 fails; X=-4.5 passes only the local width contract.
      - Any added or removed material outside the declared chunks/bridge fails preservation.
  source_boolean_identity_preflight:
    status: unresolved_do_not_approve_edits
    original_link_count: 7
    source_is_valid_count: 7
    independent_copy_comparison_pass_count: 0
    original_environment: {cadquery: 2.7.0, ocp: 7.8.1.1}
    isolated_comparison_environment: {cadquery: 2.8.0, ocp: 7.9.3.1}
    comparison_environment_pass_count: 0
    independent_reimport_comparison_pass_count: 0
    identity_contract: Both directional cuts are empty and both directional common volumes preserve positive input volumes.
    diagnosis: No self-interference was reported; periodic face coincidence can fail even on an input with no argument-analyzer warnings. Root cause remains unresolved.
    reports:
      - temp/assembly_resolution/boolean_identity_all_links.json
      - temp/assembly_resolution/boolean_identity_cq280.json
      - temp/assembly_resolution/boolean_identity_reimport.json
      - temp/assembly_resolution/boolean_arguments_all_links.json
      - temp/assembly_resolution/periodic_face_identity.json
      - temp/assembly_resolution/boolean_identity_common.json
    limitation: Invalid independent-copy Boolean differences do not establish that the physical source parts are defective.
    required_next_step: Establish a reliable no-change preservation oracle before exporting a modified part.
  no_release_until:
    - Exact masks and preservation oracle are defined for each modified link.
    - Source corner bores are not misrepresented as 26 mm of usable thread.
    - Front spacer rings and back fastening route are resolved independently.
    - Every motor/link and motor/motor collision is checked in the full final assembly.
    - Each screw can enter, seat and be tightened with the actual tool in the assembly sequence.
    - Physical PLA, load, motion and wiring requirements have evidence.
