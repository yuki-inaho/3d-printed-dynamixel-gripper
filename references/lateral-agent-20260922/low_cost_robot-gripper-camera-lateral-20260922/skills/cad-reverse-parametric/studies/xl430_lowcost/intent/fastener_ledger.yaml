    load_path_requirement: Washer must clamp the metal tube without clamping the rotating link.
    not_the_old_variant: Do not use the superseded internal printed thrust-flange stack or its bolt-overlap numbers.
    assembly_approved: false

unexpanded_scope:
  - Standard idler-to-motor center fastening and cap retention, separate from link-to-idler mounting sites.
  - Workbench/base anchoring, reaction load path and access below the base.
  - Every group's independent bolt axis, seat, stack, driver entry and tightening stage in the final assembly.
  - Emergency support stock tube, actual thread, washer, tool and preload/remaining-play validation.
  - Cable retention, E148 mounting and strain relief after the harness components are chosen.
  - Survey any additional non-motor link fastenings; absence is not established by this partial catalog.
excluded:
  - Factory internal motor screws, except explicit manufacturer-approved frame-mount replacements.
  - Output horn factory retention when supplied assembled; do not infer permission to dismantle it.
release_gates:
  - Complete and independently check the per-bolt inventory and variant choice.
  - Resolve every unselected field with source or actual-part evidence.
  - Validate each final CAD axis, contact, hole clearance, screw depth, tool and insertion path.
  - Verify PLA stack compliance, clamp load, retained play, payload and motion requirements physically.
