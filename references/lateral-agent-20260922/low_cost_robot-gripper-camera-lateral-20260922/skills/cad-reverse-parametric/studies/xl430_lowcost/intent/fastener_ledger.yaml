    url: https://emanual.robotis.com/docs/en/dxl/x/xl430-w250/#custom-frame-assembly
    checked_on: 2026-09-22
    facts: Select screw length using mounting depth; front frame examples use spacer rings.
  specification_catalog:
    source: interfaces
    yaml_keys: [sources, fastener_families]
    facts: Contains manufacturer drawing/image URLs and hashes; maximum depth is not minimum engagement.

interpretation:
  groups: Each group is a surveyed interface, not a completed per-bolt ledger.
  case_sites: Read interfaces.<role>.case_faces matching side; source_xy_mm lists existing axes.
  horn_sites: Four source mounting sites; exact axes and seat records must be bound to the final mating report.
  site_count_meaning: Source positions to investigate, not screw quantities to order or proof of accessibility.
  geometry_policy: Preserve original outlines; only necessary, authorized link holes may change diameter.
  diameter_gate: Identify actual screw and usable receiver depth before selecting link clearance diameter.
  motor_policy: Never drill or re-tap the servo case or infer threads from smooth CAD cylinders.
  same_size_not_same_screw: Machine screws and plastic tapping screws are not interchangeable.

